services:
  youtube-audio-converter:
    build: .
    container_name: thuthayatethar-youtube-audio-converter
    restart: unless-stopped
    ports:
      - "0.0.0.0:8787:8787"
    env_file:
      - .env
    volumes:
      - converter-data:/var/lib/youtube-converter
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  converter-data:
